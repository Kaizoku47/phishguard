name: phishguard-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=20
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - phishguard-dev-postgres-data:/var/lib/postgresql/data
    networks:
      - phishguard-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g

volumes:
  phishguard-dev-postgres-data:
    name: phishguard-dev-postgres-data

networks:
  phishguard-dev-network:
    name: phishguard-dev-network
    driver: bridge
