# Dependabot configuration.
#
# Only ecosystems with a committed manifest are listed. GitHub Actions
# references live in .github/workflows/ci.yml, and the backend manifest lives in
# backend/pyproject.toml. Frontend (npm) and Docker entries are added when their
# manifests exist. The `dependabot-config` CI job fails if an entry has no
# matching manifest, so this file cannot drift ahead of reality.
#
# Actions are pinned to commit SHAs with a version comment on the same line, so
# Dependabot updates both the SHA and the comment together.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Group action bumps into one pull request: a single CI run instead of
    # several on a repository with a small free-tier minute budget.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # --- Enabled when their manifests exist ------------------------------------
