[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-backend"
version = "0.1.0"
description = "PHISHGUARD backend: autonomous phishing investigation API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PHISHGUARD contributors" }]

# Runtime dependencies. Lower bounds are the minimum tested for the feature set
# in use; upper bounds stop a silent major-version jump. Exact resolved versions
# for a fresh environment are recorded in README.md.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
]

[project.optional-dependencies]
# Database driver, installed when the persistence milestone lands.
postgres = ["asyncpg>=0.30,<1"]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-env>=1.1,<2",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: requires a real external service",
]
asyncio_mode = "auto"
# The app requires a signing secret. Tests supply a throwaway value here so the
# suite is self-contained and never depends on a developer's shell environment.
env = [
    "PHISHGUARD_SECRET_KEY=test-only-secret-not-a-real-credential",
    "PHISHGUARD_ENVIRONMENT=test",
]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C4",  # comprehensions
    "SIM", # simplify
    "RET", # return statements
    "ASYNC", # async correctness
    "T20", # no print statements
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on values that look like credentials, and pytest is built on
# bare assert statements. Both are intentional in a test file.
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
